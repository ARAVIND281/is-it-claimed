[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "is-it-claimed"
version = "0.2.0"
description = "Check whether a GitHub issue is already being worked on, before you start"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aravind S" }]
keywords = ["github", "open-source", "contributing", "issues", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ARAVIND281/is-it-claimed"
Issues = "https://github.com/ARAVIND281/is-it-claimed/issues"

[project.scripts]
is-it-claimed = "is_it_claimed.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
